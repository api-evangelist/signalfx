apis:
- name: SignalFx REST API
  description: 'The SignalFx REST API manages metadata and configuration objects in Splunk Observability Cloud /
    SignalFx: metrics and dimension metadata, detectors and alert muting rules, charts, dashboards and dashboard
    groups, teams, data links, SLOs, organization and access tokens, metric rulesets, and cloud/notification integrations
    (AWS, Azure, GCP, PagerDuty, Slack, Opsgenie, Jira, ServiceNow). It is realm-based (api.{realm}.signalfx.com)
    and authenticated with the X-SF-Token header.'
