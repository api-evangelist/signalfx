aid: signalfx
name: SignalFx
description: SignalFx is a cloud monitoring and observability platform for modern infrastructure and microservices,
  founded in 2013 and acquired by Splunk in October 2019. It ingests high-resolution time-series metrics, events,
  and traces and applies real-time streaming analytics (the SignalFlow computation engine) to power dashboards,
  charts, detectors, and alerts. The platform is now delivered as Splunk Observability Cloud. SignalFx exposes a
  realm-based REST API (metadata, detectors, charts, dashboards, integrations, tokens, SLOs) at api.{realm}.signalfx.com,
  a data-ingest API at ingest.{realm}.signalfx.com, and a SignalFlow streaming API at stream.{realm}.signalfx.com,
  all authenticated with an X-SF-Token header. First-party client libraries ship for Go, Python, Node.js, Java,
  and Ruby.
